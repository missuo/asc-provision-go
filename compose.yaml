services:
  asc-provision-go:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APPLE_KEY_ID=A1B2C3D4E5
      - APPLE_ISSUER_ID=00000000-1111-2222-3333-444444444444
      - APPLE_PRIVATE_KEY_PATH=/root/AuthKey_A1B2C3D4E5.p8
